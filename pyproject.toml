[project]
name = "indicadores"
version = "0.1.0"
description = "Pipeline de dados de indicadores econômicos do Banco Central (dólar, Selic, CDI, IPCA, IGP-M) com API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
indicadores = "indicadores:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # SQLite não tem tipo decimal nativo; no PostgreSQL o valor é NUMERIC de verdade
    'ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively',
]
