services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: indicadores
      POSTGRES_PASSWORD: indicadores
      POSTGRES_DB: indicadores
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicadores"]
      interval: 2s
      retries: 15

  pipeline:
    build: .
    command: ["indicadores"]
    environment:
      DATABASE_URL: postgresql+psycopg://indicadores:indicadores@db:5432/indicadores
    depends_on:
      db: { condition: service_healthy }
    profiles: ["pipeline"]  # só roda quando chamado: docker compose run --rm pipeline

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://indicadores:indicadores@db:5432/indicadores
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
